;METADATA=(Diff=true, UseCommands=true)
[CommonSettings]
ManifestDependencies=Mods/SML/Content/Localization/SML/SML.manifest
ManifestDependencies=Mods/KBFL/Content/Localization/KBFL/KBFL.manifest
SourcePath=Mods/GameFeatures/Lead/Content/Localization/Lead
DestinationPath=Mods/GameFeatures/Lead/Content/Localization/Lead
ManifestName=Lead.manifest
ArchiveName=Lead.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=cs
CulturesToGenerate=de
CulturesToGenerate=ja
CulturesToGenerate=ko
CulturesToGenerate=pl
CulturesToGenerate=ru
CulturesToGenerate=zh-CN

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Mods/GameFeatures/Lead/Source
SearchDirectoryPaths=%LOCPROJECTROOT%Mods/GameFeatures/Lead/Config
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Mods/GameFeatures/Lead/Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/L10N/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Lead.csv
bConflictReport=true
ConflictReportName=Lead_Conflicts.txt

